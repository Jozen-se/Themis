# Continuous integration (D-42). Required status checks on main: "Build and test" and "License scan".
# Every pull request must be green here before review (CLAUDE.md, working model). Runners are pinned to
# ubuntu-24.04; an upgrade is its own pull request (RR-104, Build Brief, CI runners). Actions are pinned by commit SHA
# with the version as a comment, kept current by Dependabot (RR-50); a test category that executed no tests fails
# the job (RR-41, .github/scripts/require-tests.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages (locked to packages.lock.json)
        run: dotnet restore Themis.sln --locked-mode

      - name: Lint (dotnet format, style and analyzers)
        run: dotnet format Themis.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build Themis.sln --configuration Release --no-restore

      # RR-59, RR-65: the local stack itself, not only Testcontainers, starts on postgres:18 with its bootstrap, and
      # the migrator runs against it. The passwords are CI placeholders, passed as the compose stack expects them.
      - name: The compose stack starts and Themis.Migrator migrates it (RR-59, RR-65, RR-79)
        env:
          THEMIS_MIGRATOR_PASSWORD: ci-migrator-placeholder
          THEMIS_APP_PASSWORD: ci-app-placeholder
          THEMIS_REPORTING_PASSWORD: ci-reporting-placeholder
        run: |
          docker compose up -d --wait
          dotnet run --project src/Themis.Migrator --configuration Release --no-build -- --connection "Host=127.0.0.1;Port=5432;Database=themis;Username=themis_migrator;Password=${THEMIS_MIGRATOR_PASSWORD}"
          # Over the compose network, so the server asks for the password (loopback inside the container may be trusted).
          docker run --rm --network themis_default -e PGPASSWORD="$THEMIS_APP_PASSWORD" postgres:18 psql --no-psqlrc -v ON_ERROR_STOP=1 -h postgres -U themis_app -d themis -c 'SELECT current_user'
          docker run --rm --network themis_default -e PGPASSWORD="$THEMIS_REPORTING_PASSWORD" postgres:18 psql --no-psqlrc -v ON_ERROR_STOP=1 -h postgres -U themis_reporting -d themis -c 'SELECT current_user'
          if refused=$(docker run --rm --network themis_default -e PGPASSWORD=wrong postgres:18 psql --no-psqlrc -h postgres -U themis_app -d themis -c 'SELECT 1' 2>&1); then echo "themis_app logged in with a wrong password."; exit 1; fi
          echo "$refused"
          if ! echo "$refused" | grep -q 'password authentication failed for user "themis_app"'; then echo "The wrong password was refused for another reason."; exit 1; fi

      - name: The password script stops on a missing variable and names it (RR-65)
        run: |
          set +e
          output=$(docker compose exec -T postgres psql --no-psqlrc -v ON_ERROR_STOP=1 -U postgres -d themis \
            -v themis_migrator_password=unused -v themis_reporting_password=unused \
            -f /themis-bootstrap/02-role-passwords.psql 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then echo "02-role-passwords.psql succeeded without themis_app_password."; exit 1; fi
          if ! echo "$output" | grep -q "themis_app_password is not set"; then echo "The failure does not name themis_app_password."; exit 1; fi

      - name: Stop the compose stack
        if: always()
        run: docker compose down -v

      - name: Architecture tests (D-26)
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Architecture" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/architecture

      - name: The architecture tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/architecture

      - name: Unit tests
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Unit" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/unit

      - name: The unit tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/unit

      - name: Integration tests (PostgreSQL and Keycloak via Testcontainers, I-14, D-12)
        env:
          # The Keycloak smoke test (step 4) skips without a container runtime; CI has one, so a skip is a failure.
          THEMIS_TEST_REQUIRE_KEYCLOAK: "true"
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/integration

      - name: The integration tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/integration

      - name: Invariant tests (property-based, I-xx)
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Invariant" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/invariant

      - name: The invariant tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/invariant

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  licence-scan:
    name: License scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages (locked to packages.lock.json)
        run: dotnet restore Themis.sln --locked-mode

      - name: Scan every package, transitive included, against the permissive allowlist (D-38)
        run: >
          dotnet nuget-license
          --input Themis.sln
          --include-transitive
          --allowed-license-types eng/licenses/allowed-licenses.json
          --licenseurl-to-license-mappings eng/licenses/license-url-mappings.json
          --override-package-information eng/licenses/package-overrides.json
          --output Table
