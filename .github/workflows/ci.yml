# Continuous integration (D-42). Required status checks on main: "Build and test" and "License scan".
# Every pull request must be green here before review (CLAUDE.md, working model). Actions are pinned by commit SHA
# with the version as a comment, kept current by Dependabot (RR-50); a test category that executed no tests fails
# the job (RR-41, .github/scripts/require-tests.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages (locked to packages.lock.json)
        run: dotnet restore Themis.sln --locked-mode

      - name: Lint (dotnet format, style and analyzers)
        run: dotnet format Themis.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build Themis.sln --configuration Release --no-restore

      - name: Architecture tests (D-26)
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Architecture" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/architecture

      - name: The architecture tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/architecture

      - name: Unit tests
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Unit" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/unit

      - name: The unit tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/unit

      - name: Integration tests (PostgreSQL and Keycloak via Testcontainers, I-14, D-12)
        env:
          # The Keycloak smoke test (step 4) skips without a container runtime; CI has one, so a skip is a failure.
          THEMIS_TEST_REQUIRE_KEYCLOAK: "true"
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/integration

      - name: The integration tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/integration

      - name: Invariant tests (property-based, I-xx)
        run: dotnet test --solution Themis.sln --configuration Release --no-build --filter-trait "Category=Invariant" --ignore-exit-code 8 --report-xunit-trx --results-directory TestResults/invariant

      - name: The invariant tests executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/invariant

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  licence-scan:
    name: License scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages (locked to packages.lock.json)
        run: dotnet restore Themis.sln --locked-mode

      - name: Scan every package, transitive included, against the permissive allowlist (D-38)
        run: >
          dotnet nuget-license
          --input Themis.sln
          --include-transitive
          --allowed-license-types eng/licenses/allowed-licenses.json
          --licenseurl-to-license-mappings eng/licenses/license-url-mappings.json
          --override-package-information eng/licenses/package-overrides.json
          --output Table
