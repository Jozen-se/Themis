# A long property-based run of the invariant tests (milestone 1 step 11): the same random command sequences as the
# pull request run, with many more sequences. It runs nightly now that the repository is public (D-42, RR-85), with
# 5,000 sequences, and can still be started by hand with any count and seed. THEMIS_PROPERTY_SEQUENCES and
# THEMIS_PROPERTY_SEED are read by tests/Themis.Integration.Tests/Invariants/InvariantPropertyTests.cs.
name: Invariants long run

on:
  schedule:
    # Nightly at 02:17 UTC, off the full hour (RR-85). A scheduled run has no inputs, so the job uses 5,000 sequences.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      sequences:
        description: Number of random command sequences per property (the pull request run uses 200)
        required: true
        default: "5000"
      seed:
        description: CsCheck seed to reproduce a run (leave empty for a fresh one)
        required: false
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  long-run:
    name: Property runs (${{ inputs.sequences || '5000' }} sequences)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore packages (locked to packages.lock.json)
        run: dotnet restore Themis.sln --locked-mode

      - name: Build
        run: dotnet build Themis.sln --configuration Release --no-restore

      - name: Property runs over the real pipeline (I-01, I-02, I-03, I-04, I-06, I-08, I-09, I-15)
        env:
          THEMIS_PROPERTY_SEQUENCES: ${{ inputs.sequences || '5000' }}
          THEMIS_PROPERTY_SEED: ${{ inputs.seed }}
        run: dotnet test --project tests/Themis.Integration.Tests/Themis.Integration.Tests.csproj --configuration Release --no-build --filter-trait "Category=Invariant" --report-xunit-trx --results-directory TestResults/invariant-long-run

      - name: The property runs executed at least one test (RR-41)
        if: always()
        run: .github/scripts/require-tests.sh TestResults/invariant-long-run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invariant-long-run-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 30
