# Developer Certificate of Origin (D-36): every commit of a pull request carries a Signed-off-by line matching its
# author; dependabot[bot], github-actions[bot] and merge commits are exempt; squash commits on main are not checked.
# The check is .github/scripts/dco-check.sh; the second job proves the script itself on synthetic repositories.
# Making "DCO sign-off" a required status check is a change to the ruleset on main, which the owner makes (D-42).
#
# RR-134: a commit pushed with GITHUB_TOKEN starts no pull_request run, so the Dependabot lock files workflow dispatches
# this workflow on the new head, as it does CI. A workflow_dispatch run checks out the tip of the ref it was dispatched
# on; github.sha is that commit, and the run's check runs (job names "DCO sign-off" and "DCO check self-test") attach
# to it, which is the commit the ruleset looks at. A dispatch takes no input: the head is the dispatched commit and
# .github/scripts/dco-dispatch.sh derives the base as its merge base with refs/remotes/origin/main, so no caller can
# choose the range.
name: DCO

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out with the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # RR-85: event values reach the shell only through environment variables, quoted; RR-134: on a dispatched run the
      # head is the dispatched commit and the base is derived from the main branch's full ref, never from an input.
      - name: Every commit of the pull request carries a matching Signed-off-by line (D-36)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            .github/scripts/dco-dispatch.sh "${DISPATCHED_SHA}" refs/remotes/origin/main
          else
            .github/scripts/dco-check.sh "${PR_BASE}" "${PR_HEAD}"
          fi

  self-test:
    name: DCO check self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The check fails an unsigned commit and passes signed, bot and merge commits
        run: .github/scripts/dco-check-selftest.sh
