# Local development stack: PostgreSQL (system of record, D-04) and Keycloak (OpenID Connect provider, D-12).
# The application itself runs with `dotnet run --project src/Host/Themis.Host` against this stack.
# Credentials here are development defaults; see db/bootstrap/01-roles.sql and docs/development.md.

name: themis

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: themis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d themis"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/themis-realm.json:/opt/keycloak/data/import/themis-realm.json:ro

volumes:
  postgres-data:
  keycloak-data:
